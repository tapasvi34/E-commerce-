<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upgrade to Pro - CodeLadder</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: 'Press Start 2P', cursive; }
        .pay-container {
            max-width: 500px;
            margin: 50px auto;
            background: #8b4513; /* Wood brown */
            padding: 30px;
            border: 6px solid #3e2723;
            box-shadow: 10px 10px 0px #000;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            border: 4px solid #000;
        }
        #main-btn {
            background: #ff4500;
            color: white;
            padding: 15px;
            width: 100%;
            border: 4px solid #000;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            margin-top: 20px;
            box-shadow: 4px 4px 0px #000;
        }
        
        /* THE "FAST PASS" BUTTON FOR EXAMINER */
        .demo-btn {
            background: #3cb371; /* Green */
            color: white;
            padding: 12px;
            width: 100%;
            border: 4px solid #000;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            margin-top: 30px;
            font-size: 8px;
            box-shadow: 4px 4px 0px #000;
            text-decoration: none;
            display: inline-block;
        }

        #main-btn:active, .demo-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #000; }
        #message-box { display: none; color: #ffff00; font-size: 8px; margin-top: 15px; line-height: 1.5; }
        
        .divider {
            margin: 25px 0 10px;
            border-top: 4px dashed #3e2723;
            padding-top: 10px;
            font-size: 8px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <header style="background: #5c4033; padding: 20px; border-bottom: 6px solid #3e2723;">
        <div class="logo">🧱 CodeLadder PRO</div>
    </header>

    <div class="pay-container">
        <h2>SECURE GATEWAY</h2>
        <p style="font-size: 8px; margin: 20px 0; color: #ddd;">LEVEL UP YOUR ACCOUNT</p>
        
        <form id="main-form">
            <input type="text" id="userName" placeholder="PLAYER NAME" required>
            <input type="email" id="userEmail" placeholder="EMAIL" required>
            <input type="text" id="userPhone" placeholder="PHONE" required>
            <button type="submit" id="main-btn">PROCEED TO PAY</button>
        </form>

        <div id="message-box"></div>

        <div class="divider">DEBUG MODE</div>
        <a href="paid-course.html" class="demo-btn">GO TO COURSE (DEMO)</a>
    </div>

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script>
        const cashfree = Cashfree({ mode: "sandbox" });
        const USER_ID = localStorage.getItem('codingLadderUserId');

        document.getElementById('main-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('main-btn');
            const msgBox = document.getElementById('message-box');
            
            msgBox.style.display = 'none';
            btn.innerText = "OPENING GATEWAY...";
            btn.disabled = true;

            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;
            const phone = document.getElementById('userPhone').value;

            try {
                const response = await fetch('http://localhost:5000/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, userId: USER_ID })
                });
                
                const data = await response.json();
                
                if (data.payment_session_id) {
                    cashfree.checkout({
                        paymentSessionId: data.payment_session_id,
                        redirectTarget: "_self" 
                    });
                } else {
                    throw new Error("Invalid Session ID");
                }
            } catch (err) {
                msgBox.style.display = 'block';
                msgBox.innerHTML = `CONNECTION FAILED!<br>Check if your Node server is running on Port 5000`;
                btn.innerText = "PROCEED TO PAY";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
