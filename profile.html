<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coder Profile - CodeLadder</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #1a1a1a; --wood: #8b4513; --border: #3e2723; --gold: #ffd700; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Press Start 2P', cursive; background: var(--bg); color: white; padding: 20px; line-height: 1.6; }
        
        /* 8-BIT HEADER */
        header { background: #5c4033; padding: 20px; border: 6px solid var(--border); margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: white; font-size: 14px; }
        nav a { color: var(--gold); text-decoration: none; font-size: 10px; margin-left: 15px; }

        /* PROFILE CARD */
        .profile-container { max-width: 800px; margin: auto; }
        .stat-card { background: var(--wood); border: 6px solid var(--border); padding: 25px; margin-bottom: 20px; box-shadow: 8px 8px 0px #000; }
        
        .user-info h1 { font-size: 24px; color: var(--gold); margin-bottom: 10px; text-shadow: 4px 4px #000; }
        .rank-tag { font-size: 10px; background: #000; padding: 5px 10px; display: inline-block; margin-bottom: 20px; border: 2px solid #fff; }

        /* XP BAR */
        .xp-container { margin: 20px 0; text-align: left; }
        .xp-label { font-size: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .xp-bg { background: #000; height: 20px; border: 3px solid #fff; width: 100%; }
        .xp-fill { background: var(--gold); height: 100%; width: 0%; transition: width 0.5s ease-out; }

        /* GRID FOR STATS */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .mini-box { background: #3e2723; padding: 15px; border: 4px solid #000; text-align: center; }
        .mini-box span { display: block; font-size: 18px; margin-top: 10px; color: var(--gold); }
        .mini-box label { font-size: 8px; color: #ccc; }

        /* LISTS */
        .pixel-card { background: #fff; color: #000; border: 4px solid #000; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .card-txt h3 { font-size: 10px; margin-bottom: 5px; }
        .card-txt p { font-size: 8px; color: #555; }
        .btn-game { background: #ff4500; color: white; border: 3px solid #000; padding: 8px 12px; cursor: pointer; font-family: 'Press Start 2P', cursive; font-size: 8px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🧱 CODELADDER</div>
        <nav>
            <a href="dashboard.html">DASHBOARD</a>
            <a href="http://localhost:3000">START QUEST</a>
            <a href="#" onclick="localStorage.clear(); location.href='login.html'">LOGOUT</a>
        </nav>
    </header>

    <div class="profile-container">
        <div class="stat-card">
            <div class="user-info">
                <h1 id="uName">LOADING...</h1>
                <div class="rank-tag" id="uRank">RANK: ???</div>
            </div>

            <div class="xp-container">
                <div class="xp-label">
                    <span>LEVEL <span id="uLevel">0</span></span>
                    <span id="uXpText">0/0</span>
                </div>
                <div class="xp-bg">
                    <div id="xpBar" class="xp-fill"></div>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="mini-box">
                <label>QUESTS</label>
                <span id="uQuests">0</span>
            </div>
            <div class="mini-box">
                <label>BLOCKS</label>
                <span id="uBlocks">0</span>
            </div>
            <div class="mini-box">
                <label>STREAK</label>
                <span id="uStreak">0</span>
            </div>
        </div>

        <h2 style="font-size: 12px; margin-bottom: 15px;">📜 SAVED ROADMAPS</h2>
        <div id="pathList"></div>

        <h2 style="font-size: 12px; margin-top: 30px; margin-bottom: 15px;">🛒 MY COURSES</h2>
        <div id="courseList"></div>
    </div>

    <script>
        let USER_ID = localStorage.getItem('codingLadderUserId');

        async function initProfile() {
            if (!USER_ID) {
                alert("Access Denied! Please Login to view your Profile.");
                window.location.href = "login.html";
                return;
            }

            try {
                const response = await fetch(`http://localhost:5000/api/profile/${USER_ID}`);
                const result = await response.json();
                
                if (result.success) {
                    updateUI(result.data);
                } else {
                    localStorage.removeItem('codingLadderUserId');
                    window.location.href = "login.html";
                }
            } catch (error) {
                document.getElementById('uName').innerText = "CONNECTION ERROR";
                console.error(error);
            }
        }

        function updateUI(user) {
            document.getElementById('uName').innerText = user.username;
            document.getElementById('uRank').innerText = `RANK: ${user.rank}`;
            document.getElementById('uLevel').innerText = user.level;
            
            const nextXp = user.nextLevelXp || 1000;
            document.getElementById('uXpText').innerText = `${user.xp}/${nextXp}`;
            
            document.getElementById('uQuests').innerText = user.questsCompleted || 0;
            document.getElementById('uBlocks').innerText = user.skillBlocksMined || 0;
            document.getElementById('uStreak').innerText = user.streak || 1;

            const xpPercent = Math.min((user.xp / nextXp) * 100, 100);
            document.getElementById('xpBar').style.width = xpPercent + "%";

            renderList('pathList', user.savedPaths, 'VIEW MAP');
            renderList('courseList', user.purchasedCourses, 'RESUME');
        }

        function renderList(targetId, items, btnText) {
            const container = document.getElementById(targetId);
            if (!items || items.length === 0) {
                container.innerHTML = `<p style="font-size: 8px; color: #888;">No items found. Start an adventure!</p>`;
                return;
            }
            container.innerHTML = ""; 
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'pixel-card';
                div.innerHTML = `
                    <div class="card-txt">
                        <h3>${item.title || "Roadmap"}</h3>
                        <p>${item.goal || 'AI Generated Path'}</p>
                    </div>
                    <button class="btn-game">${btnText}</button>
                `;
                container.appendChild(div);
            });
        }

        window.onload = initProfile;
    </script>
</body>
</html>
