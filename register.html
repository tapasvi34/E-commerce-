<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Register - CodeLadder</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

    <style>
      /* ... (Keeping your existing CSS as it looks great!) ... */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Press Start 2P", cursive;
        background: linear-gradient(to bottom, #87ceeb 60%, #3cb371 60%);
        color: white;
        text-align: center;
        overflow-x: hidden;
      }
      header {
        background: #5c4033;
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 6px solid #3e2723;
      }
      nav a { text-decoration: none; color: white; margin-left: 25px; font-size: 12px; }
      nav a:hover { color: yellow; }
      .sky { position: fixed; width: 100%; height: 60vh; top: 0; left: 0; z-index: -1; }
      .cloud { position: absolute; width: 120px; height: 40px; background: rgba(255, 255, 255, 0.8); }
      .cloud:before, .cloud:after { content: ""; position: absolute; background: rgba(255, 255, 255, 0.8); }
      .cloud:before { width: 60px; height: 60px; top: -20px; left: 10px; }
      .cloud:after { width: 60px; height: 60px; top: -20px; right: 10px; }
      .cloud1 { top: 80px; left: -200px; animation: moveCloud 60s linear infinite; }
      .cloud2 { top: 150px; left: -300px; animation: moveCloud 90s linear infinite; }
      @keyframes moveCloud { from { transform: translateX(0); } to { transform: translateX(130vw); } }
      .login-section { padding: 120px 20px; display: flex; justify-content: center; align-items: center; }
      .login-box { background: #8b4513; padding: 50px 30px; border: 6px solid #3e2723; box-shadow: 8px 8px 0 #000; width: 100%; max-width: 450px; }
      .login-box h2 { font-size: 18px; margin-bottom: 40px; text-shadow: 4px 4px 0 #000; }
      .form-group { margin-bottom: 25px; text-align: left; }
      .form-group label { font-size: 10px; display: block; margin-bottom: 10px; }
      .form-group input { width: 100%; padding: 12px; font-family: "Press Start 2P", cursive; font-size: 10px; border: 4px solid #3e2723; outline: none; background: #fff; color: #000; }
      .login-btn { margin-top: 30px; font-family: "Press Start 2P", cursive; font-size: 12px; padding: 15px 30px; background: #006400; border: 6px solid #004d00; color: white; cursor: pointer; box-shadow: 6px 6px 0 #000; transition: 0.2s; width: 100%; }
      .login-btn:hover { transform: translateY(-5px); background: #008000; }
      .extra-links { margin-top: 25px; font-size: 10px; }
      .extra-links a { color: yellow; text-decoration: none; line-height: 20px; }
      footer { background: #5c4033; padding: 20px; font-size: 12px; border-top: 6px solid #3e2723; margin-top: 80px; }
    </style>
  </head>

  <body>
    <header>
      <h3>CodeLadder</h3>
      <nav>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <div class="sky">
      <div class="cloud cloud1"></div>
      <div class="cloud cloud2"></div>
    </div>

    <section class="login-section">
      <div class="login-box">
        <h2>CREATE ACCOUNT</h2>

        <form id="registerForm">
          <div class="form-group">
            <label>PLAYER NAME</label>
            <input type="text" id="regUsername" placeholder="e.g. CoderPro99" required />
          </div>

          <div class="form-group">
            <label>EMAIL</label>
            <input type="email" id="regEmail" placeholder="email@example.com" required />
          </div>

          <div class="form-group">
            <label>PASSWORD</label>
            <input type="password" id="regPassword" required />
          </div>

          <button type="submit" class="login-btn">REGISTER</button>
        </form>

        <div class="extra-links">
          <p>Already have account? <a href="login.html">Login</a></p>
        </div>
      </div>
    </section>

    <footer>© 2026 CodeLadder | All Rights Reserved</footer>

    <script>
      document.getElementById("registerForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        // 1. Gather all data FIRST
        const username = document.getElementById("regUsername").value;
        const email = document.getElementById("regEmail").value;
        const password = document.getElementById("regPassword").value;

        try {
          // 2. Send the request
          const res = await fetch("http://localhost:5000/api/auth/register", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ 
                username: username, 
                email: email, 
                password: password 
            }),
          });

          const data = await res.json();

          if (res.ok) {
            alert("Account Created 🎉 Welcome " + username + "!");
            window.location.href = "login.html";
          } else {
            // Check if backend sent a message or just a raw string
            alert("Error: " + (data.message || data));
          }
        } catch (error) {
          console.error("Fetch Error:", error);
          alert("Server is offline. Please try again later.");
        }
      });
    </script>
  </body>
</html>
