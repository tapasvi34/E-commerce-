<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login - CodeLadder</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Press Start 2P", cursive;
        background: linear-gradient(to bottom, #87ceeb 60%, #3cb371 60%);
        color: white;
        text-align: center;
        overflow-x: hidden;
      }

      header {
        background: #5c4033;
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 6px solid #3e2723;
      }

      nav a {
        text-decoration: none;
        color: white;
        margin-left: 25px;
        font-size: 12px;
      }

      nav a:hover {
        color: yellow;
      }

      .sky {
        position: fixed;
        width: 100%;
        height: 60vh;
        top: 0;
        left: 0;
        z-index: -1;
      }

      .cloud {
        position: absolute;
        width: 120px;
        height: 40px;
        background: rgba(255, 255, 255, 0.8);
      }

      .cloud:before,
      .cloud:after {
        content: "";
        position: absolute;
        background: rgba(255, 255, 255, 0.8);
      }

      .cloud:before {
        width: 60px;
        height: 60px;
        top: -20px;
        left: 10px;
      }

      .cloud:after {
        width: 60px;
        height: 60px;
        top: -20px;
        right: 10px;
      }

      .cloud1 {
        top: 80px;
        left: -200px;
        animation: moveCloud 60s linear infinite;
      }

      .cloud2 {
        top: 150px;
        left: -300px;
        animation: moveCloud 90s linear infinite;
      }

      @keyframes moveCloud {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(130vw);
        }
      }

      .login-section {
        padding: 120px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-box {
        background: #8b4513;
        padding: 50px 30px;
        border: 6px solid #3e2723;
        box-shadow: 8px 8px 0 #000;
        width: 100%;
        max-width: 450px;
      }

      .login-box h2 {
        font-size: 20px;
        margin-bottom: 40px;
        text-shadow: 4px 4px 0 #000;
      }

      .form-group {
        margin-bottom: 25px;
        text-align: left;
      }

      .form-group label {
        font-size: 10px;
        display: block;
        margin-bottom: 10px;
      }

      .form-group input {
        width: 100%;
        padding: 12px;
        font-family: "Press Start 2P", cursive;
        font-size: 10px;
        border: 4px solid #3e2723;
        outline: none;
        background: #fff;
        color: #000;
      }

      .login-btn {
        margin-top: 30px;
        font-family: "Press Start 2P", cursive;
        font-size: 14px;
        padding: 15px 30px;
        background: #8b0000;
        border: 6px solid #5c0000;
        color: white;
        cursor: pointer;
        box-shadow: 6px 6px 0 #000;
        transition: 0.2s;
        width: 100%;
      }

      .login-btn:hover {
        transform: translateY(-5px);
        background: #a00000;
      }

      .extra-links {
        margin-top: 25px;
        font-size: 10px;
      }

      .extra-links a {
        color: yellow;
        text-decoration: none;
        line-height: 20px;
      }

      .extra-links a:hover {
        text-decoration: underline;
      }

      footer {
        background: #5c4033;
        padding: 20px;
        font-size: 12px;
        border-top: 6px solid #3e2723;
        margin-top: 80px;
      }
    </style>
  </head>

  <body>
    <header>
      <h3>CodeLadder</h3>
      <nav>
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        
      </nav>
    </header>

    <div class="sky">
      <div class="cloud cloud1"></div>
      <div class="cloud cloud2"></div>
    </div>

    <section class="login-section">
      <div class="login-box">
        <h2>PLAYER LOGIN</h2>

        <form id="loginForm">
          <div class="form-group">
            <label>EMAIL</label>
            <input type="email" required />
          </div>

          <div class="form-group">
            <label>PASSWORD</label>
            <input type="password" required />
          </div>

          <button type="submit" class="login-btn">LOGIN</button>
        </form>

        <div class="extra-links">
          <p><a href="#">Forgot Password?</a></p>
          <p>New Player? <a href="register.html">Create Account</a></p>
        </div>
      </div>
    </section>

    <footer>© 2026 Pixel Academy | All Rights Reserved</footer>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const email = document.querySelector("input[type='email']").value;
          const password = document.querySelector(
            "input[type='password']",
          ).value;

          console.log("Login clicked");

          const res = await fetch("http://localhost:5000/api/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email, password }),
          });

          const data = await res.json();

          // Replace the 'if (res.ok)' block in your login.html script with this:
if (res.ok) {
    alert("Login Successful 🎉");
    
    // 💾 THIS IS THE KEY: Save the ID for the rest of the app to use
    localStorage.setItem('codingLadderUserId', data.userId);
    localStorage.setItem('username', data.username); // Optional, for greeting
    
    window.location.href = "dashboard.html"; // Redirect to dashboard, not homepage
} else {
    // If 'data' is an object, we want the message string
    alert(data.message || "Invalid Login");
}
        });
    </script>
  </body>
</html>
