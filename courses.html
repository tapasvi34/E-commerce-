<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Videos - 8-Bit Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Press Start 2P", cursive;
            /* Retro Sky and Grass Gradient */
            background: linear-gradient(to bottom, #87ceeb 60%, #3cb371 60%);
            background-attachment: fixed;
            color: white;
            text-align: center;
            padding-bottom: 50px;
        }

        /* HEADER STYLE */
        header {
            background: #5c4033;
            padding: 20px;
            border-bottom: 6px solid #3e2723;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 32px;
            text-shadow: 4px 4px 0px #000;
            margin-top: 20px;
            color: #ffffff;
        }

        h2 {
            font-size: 14px;
            margin: 20px 0 40px;
            text-shadow: 2px 2px 0px #000;
            color: #ffff00; /* Retro Yellow */
        }

        /* VIDEO GRID */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        /* PIXEL ART CARD STYLE */
        .video-card {
            background: #ffffff;
            border: 6px solid #000;
            padding: 15px;
            image-rendering: pixelated;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .video-card:hover {
            transform: scale(1.02);
            box-shadow: 12px 12px 0px #000;
        }

        video {
            width: 100%;
            border: 4px solid #000;
            background: #000;
        }

        .course-title {
            margin: 20px 0;
            font-size: 12px;
            color: #000;
            line-height: 1.5;
        }

        /* BUTTONS */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .buy-btn, .enroll-btn {
            font-family: "Press Start 2P", cursive;
            padding: 12px;
            font-size: 10px;
            cursor: pointer;
            border: 4px solid #000;
            width: 100%;
            transition: all 0.1s;
        }

        .buy-btn {
            background: #ff4500; /* Mario Red */
            color: white;
            box-shadow: 4px 4px 0px #8b0000;
        }

        .enroll-btn {
            background: #ffd700; /* Coin Yellow */
            color: #000;
            box-shadow: 4px 4px 0px #b8860b;
        }

        .buy-btn:active, .enroll-btn:active {
            box-shadow: 0px 0px 0px #000;
            transform: translate(2px, 2px);
        }

        /* MODAL STYLE */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #5c4033;
            border: 6px solid #fff;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .modal-content h3 { font-size: 16px; margin-bottom: 20px; }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-family: "Press Start 2P", cursive;
            font-size: 10px;
            border: 4px solid #000;
        }

        .submit-btn {
            background: #3cb371;
            color: white;
            padding: 12px;
            width: 100%;
            border: 4px solid #000;
            font-family: "Press Start 2P", cursive;
            margin-top: 10px;
        }

        .close-btn {
            margin-top: 15px;
            background: none;
            border: none;
            color: #ffa500;
            font-family: "Press Start 2P", cursive;
            font-size: 10px;
            cursor: pointer;
        }

        /* ASSISTANT DOT */
        #assistant-dot {
            position: fixed;
            width: 20px;
            height: 20px;
            background: #fff;
            border: 4px solid #000;
            z-index: 9999;
            pointer-events: none;
            animation: bounce 0.5s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

<header>
    <div style="font-size: 10px;">LVL 1-1</div>
</header>

<div id="assistant-dot"></div>

<h1>COURSE VIDEOS</h1>
<h2>SELECT YOUR STAGE</h2>

<div class="video-grid">
    <div class="video-card">
        <video controls><source src="video.mp4"></video>
        <div class="course-title">PYTHON PROGRAMMING</div>
        <div class="btn-group">
            <button class="buy-btn" onclick="goToPayment()">BUY COURSE</button>
            <button class="enroll-btn" onclick="openModal('Python Programming')">ENROLL NOW</button>
        </div>
    </div>

    <div class="video-card">
        <video controls><source src="video2.mp4"></video>
        <div class="course-title">WEB DEVELOPMENT</div>
        <div class="btn-group">
            <button class="buy-btn" onclick="goToPayment()">BUY COURSE</button>
            <button class="enroll-btn" onclick="openModal('Web Development')">ENROLL NOW</button>
        </div>
    </div>

    <div class="video-card">
        <video controls><source src="video3.mp4"></video>
        <div class="course-title">MACHINE LEARNING</div>
        <div class="btn-group">
            <button class="buy-btn" onclick="goToPayment()">BUY COURSE</button>
            <button class="enroll-btn" onclick="openModal('Machine Learning')">ENROLL NOW</button>
        </div>
    </div>
</div>

<div class="modal" id="enrollModal">
    <div class="modal-content">
        <h3>ENROLL NOW</h3>
        <input type="text" placeholder="NAME">
        <input type="email" placeholder="EMAIL">
        <input type="text" id="courseName" readonly>
        <button class="submit-btn">START</button>
        <button class="close-btn" onclick="closeModal()">[CANCEL]</button>
    </div>
</div>

<script>
    function goToPayment() { window.location.href = "payment.html"; }
    function openModal(course) {
    // Instead of showing a modal, we teleport to the new stage
    window.location.href = `single-course.html?course=${encodeURIComponent(course)}`;
}
    function closeModal() { document.getElementById("enrollModal").style.display = "none"; }

    // Dot logic
    const dot = document.getElementById("assistant-dot");
    document.addEventListener("mousemove", (e) => {
        dot.style.left = e.clientX + "px";
        dot.style.top = e.clientY + "px";
    });
</script>

</body>
</html>
