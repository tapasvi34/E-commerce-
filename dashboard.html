<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - CodeLadder</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Press Start 2P', cursive; 
            background: #1a1a1a; 
            color: white; 
            padding: 20px; 
            line-height: 1.6;
        }

        /* 8-BIT NAV */
        .nav { 
            background: #5c4033; 
            padding: 20px; 
            border: 4px solid #3e2723; 
            margin-bottom: 30px;
            display: flex;
            justify-content: space-around;
        }
        .nav a { color: yellow; text-decoration: none; font-size: 10px; }
        .nav a:hover { color: white; }

        /* STAT CARDS */
        .stat-card { 
            background: #2e7d32; 
            padding: 25px; 
            border: 6px solid #1b5e20; 
            margin-bottom: 20px; 
            box-shadow: 8px 8px 0px #000;
        }

        .xp-bar-bg {
            background: #000;
            height: 20px;
            width: 100%;
            border: 2px solid white;
            margin-top: 10px;
        }
        .xp-bar-fill {
            background: #ffff00;
            height: 100%;
            width: 0%; /* Will be updated by JS */
            transition: width 0.5s;
        }

        /* ROADMAP LIST */
        #roadmap-list { list-style: none; margin-top: 20px; }
        .roadmap-item {
            background: #8b4513;
            border: 4px solid #3e2723;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .view-btn {
            background: #ff4500;
            color: white;
            border: none;
            padding: 5px 10px;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            cursor: pointer;
        }

        /* MODAL FOR VIEWING ROADMAP */
        #roadmap-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: black;
            padding: 30px;
            border: 8px solid #000;
            width: 80%;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 100;
            font-family: sans-serif; /* Cleaner for reading long text */
        }
    </style>
</head>
<body>

    <div class="nav">
        <a href="dashboard.html">DASHBOARD</a>
        <a href="courses.html">COURSES</a>
        <a href="http://localhost:3000">QUEST GENERATOR</a> <a href="profile.html">MY PROFILE</a>
        <a href="#" onclick="logout()">LOGOUT</a>
    </div>

    <h1>PLAYER: <span id="user-name" style="color: yellow;">...</span></h1>
    
    <div class="stat-card">
        <h3>LEVEL <span id="user-level">1</span> - <span id="user-rank">NOOB</span></h3>
        <p style="font-size: 10px; margin-top:10px;">XP: <span id="user-xp">0</span> / 1000</p>
        <div class="xp-bar-bg">
            <div id="xp-fill" class="xp-bar-fill"></div>
        </div>
    </div>

    <div class="stat-card" style="background: #455a64; border-color: #263238;">
        <h3>COMPLETED QUESTS</h3>
        <ul id="roadmap-list"></ul>
    </div>

    <div id="roadmap-modal">
        <h2 id="modal-title"></h2>
        <hr>
        <div id="modal-content" style="margin-top: 20px; line-height: 1.5;"></div>
        <button onclick="closeModal()" style="margin-top: 20px; padding: 10px;">CLOSE [X]</button>
    </div>

    <script>
        const userId = localStorage.getItem('codingLadderUserId'); //localstorage fetches info abt specific userid from mongo 
        if (!userId) {
            window.location.href = 'login.html'; 
        } //if not id then go to loginn page

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        fetch(`http://localhost:5000/api/profile/${userId}`) //call backend and fetch info
            .then(res => res.json())
            .then(result => {
                if (!result.success) return logout();

                const user = result.data;
                document.getElementById('user-name').innerText = user.username;
                document.getElementById('user-rank').innerText = user.rank;
                document.getElementById('user-level').innerText = user.level;
                document.getElementById('user-xp').innerText = user.xp;
                
                // xp bar display:
                const xpPercent = (user.xp / 1000) * 100;
                document.getElementById('xp-fill').style.width = xpPercent + "%";

                const list = document.getElementById('roadmap-list');
                user.savedPaths.forEach((path, index) => {
                    let li = document.createElement('li');
                    li.className = "roadmap-item";
                    li.innerHTML = `
                        <span style="font-size: 10px;">${path.title}</span>
                        <button class="view-btn" onclick="viewPath(${index})">VIEW</button>
                    `;
                    list.appendChild(li);
                });

                // Store paths globally for the modal
                window.myPaths = user.savedPaths;
            });

        function viewPath(index) {
            const path = window.myPaths[index];
            document.getElementById('modal-title').innerText = path.title;
            // The AI text is stored in phases[0] or result based on  save-path route
            document.getElementById('modal-content').innerText = path.phases[0] || "No content found.";
            document.getElementById('roadmap-modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('roadmap-modal').style.display = 'none';
        }
    </script>
</body>
</html>
